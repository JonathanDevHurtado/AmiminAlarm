name: 🐛 Reporte de bug
description: Reporta un problema para ayudarnos a mejorar AmiminAlarm
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por tomarte el tiempo de reportar este problema!
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción del problema
      description: Una descripción clara y concisa de qué ocurre.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Ir a '...'
        2. Tocar en '...'
        3. Ver el error
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de AmiminAlarm
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Versión de Android y dispositivo
      placeholder: "Android 13 · Nokia 5.4"
    validations:
      required: true
  - type: textarea
    id: capturas
    attributes:
      label: Capturas o vídeo
      description: Arrastra aquí imágenes o vídeos si es posible.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Salida de `adb logcat` si aplica.
      render: shell
    validations:
      required: false
